<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Click the Dot</title>
  <style>
    body { margin: 0; }
    canvas { display: block; background: white; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    // Get the canvas (the drawing area) and make it fill the window.
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d"); // ctx is what we draw with
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // The circle: where it is and how big it is.
    const circle = { x: 0, y: 0, radius: 30 };

    // When the current circle appeared (in milliseconds).
    let spawnTime = 0;

    // Put the circle somewhere random and remember when it appeared.
    function moveCircle() {
      circle.x = circle.radius + Math.random() * (canvas.width - 2 * circle.radius);
      circle.y = circle.radius + Math.random() * (canvas.height - 2 * circle.radius);
      spawnTime = performance.now();
      draw();
    }

    // Clear the screen and draw the circle.
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
      ctx.fillStyle = "black";
      ctx.fill();
    }

    // Every click: check if it was inside the circle.
    canvas.addEventListener("click", (event) => {
      const dx = event.clientX - circle.x;
      const dy = event.clientY - circle.y;
      const distance = Math.sqrt(dx * dx + dy * dy); // Pythagoras

      if (distance <= circle.radius) {
        const reactionTime = performance.now() - spawnTime;
        console.log("Hit! Time to click:", reactionTime.toFixed(0), "ms");
        moveCircle();
      }
    });

    // Start the game.
    moveCircle();
  </script>
</body>
</html>
